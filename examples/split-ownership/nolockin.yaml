# Variante « propriété séparée » : la base et le staging ici, la prod dans environments/prod.yaml
# (protégé par CODEOWNERS). Même sémantique de fusion, un environnement défini à un seul endroit.
apiVersion: nolockin.io/v1
kind: App
metadata:
  name: shop-api
spec:
  source:
    git: https://github.com/acme/shop-api
    build: { type: buildpacks }
  services:
    - name: web
      port: 8080
      resources: { cpu: 500m, memory: 512Mi }
  addons:
    - { name: db, type: postgres, version: "16" }
  env:
    DATABASE_URL: { fromAddon: db, key: url }
  deploy:
    requireChecks: true

environments:
  staging:
    project: acme-staging
    track: main
    services:
      web: { scale: { min: 1, max: 2 } }
    addons:
      db: { plan: single, storage: 5Gi }
