<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · NoLockIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@900&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#F2F5F1;--ink:#0F1D16;--ink-2:#4A5A51;--accent:#0E8A4A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B1410;--ink:#E6EEE8;--ink-2:#A6B6AC;--accent:#3DD68C;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:2rem}
main{max-width:34rem;display:flex;flex-direction:column;gap:1rem}
h1{font:900 clamp(2rem,6vw,3.2rem)/1.05 Overpass,sans-serif;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--ink-2)}
a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
<h1>Cette page n'existe pas. La sortie, si.</h1>
<p>Le lien est peut-être ancien : la documentation a été réorganisée. Repartez du <a href="/docs/" data-rel="docs/">sommaire de la documentation</a> ou de la <a href="/" data-rel="">page d'accueil</a>.</p>
</main>
<script>
/* Sous GitHub Pages (<org>.github.io/<repo>/), le site vit sous un préfixe : on le rétablit. */
(function(){var base='/';if(/\.github\.io$/.test(location.hostname)){var seg=location.pathname.split('/')[1];if(seg)base='/'+seg+'/'}
document.querySelectorAll('a[data-rel]').forEach(function(a){a.href=base+a.getAttribute('data-rel')})})();
</script>
</body>
</html>
